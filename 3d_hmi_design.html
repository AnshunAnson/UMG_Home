<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D HMI 概念设计 - 作品展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 60px 20px 40px;
            background: rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .date {
            color: #888;
            font-size: 1rem;
        }

        .header .tags {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header .tag {
            background: rgba(102, 126, 234, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #667eea;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .gallery {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
        }

        .gallery-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gallery-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.3);
        }

        .gallery-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        .gallery-item-info {
            padding: 20px;
            text-align: center;
        }

        .gallery-item-info h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .gallery-item-info p {
            color: #888;
            font-size: 0.9rem;
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>3D HMI 概念设计</h1>
        <p class="date">2025-01-13 16:18:01</p>
        <div class="tags">
            <span class="tag">HMI</span>
            <span class="tag">UX</span>
            <span class="tag">UI</span>
            <span class="tag">用研</span>
            <span class="tag">智能出行</span>
            <span class="tag">CGI</span>
            <span class="tag">原创</span>
        </div>
    </div>

    <div class="gallery">
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="https://cdn.autoxyz.cn/prod/image/2025/01/13/fhd-a3b76d30c12a4250835ef9cdd022a6c2.png" alt="3D HMI 设计图 1">
                <div class="gallery-item-info">
                    <h3>设计效果图 1</h3>
                    <p>3D HMI 概念设计</p>
                </div>
            </div>
            <div class="gallery-item">
                <img src="https://cdn.autoxyz.cn/prod/image/2025/01/13/fhd-a8a16ce8ec864e83a47b45c46d98cc78.png" alt="3D HMI 设计图 2">
                <div class="gallery-item-info">
                    <h3>设计效果图 2</h3>
                    <p>3D HMI 概念设计</p>
                </div>
            </div>
            <div class="gallery-item">
                <img src="https://cdn.autoxyz.cn/prod/image/2025/01/13/fhd-10d2981ac5174bed9cf371818adc03f8.png" alt="3D HMI 设计图 3">
                <div class="gallery-item-info">
                    <h3>设计效果图 3</h3>
                    <p>3D HMI 概念设计</p>
                </div>
            </div>
            <div class="gallery-item">
                <img src="https://cdn.autoxyz.cn/prod/image/2025/01/13/fhd-e1d91e41d8864b7f805c1dafa5ae47b8.png" alt="3D HMI 设计图 4">
                <div class="gallery-item-info">
                    <h3>设计效果图 4</h3>
                    <p>3D HMI 概念设计</p>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>作品来源：AutoY 智能出行平台</p>
    </div>
</body>
</html>
